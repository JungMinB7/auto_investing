[alembic]
script_location = alembic
prepend_sys_path = .

# Database URL — override via ALEMBIC_DB_URL env var or set here for local dev
# Format: postgresql+asyncpg://user:pass@host/db
sqlalchemy.url = postgresql+asyncpg://trading:change-me@localhost/auto_investing

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
