[project]
name = "auto-investing"
version = "0.1.0"
description = "Fully automated KRX stock trading engine using pro-securities-analyst signals"
authors = [{ name = "JungMinB7", email = "ljlm0829@gmail.com" }]
requires-python = ">=3.12"
dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    # Data validation
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    # Database
    "sqlalchemy>=2.0.30",
    "alembic>=1.13.0",
    "asyncpg>=0.29.0",
    # Cache / lock
    "redis>=5.0.0",
    # HTTP client (Kiwoom REST API)
    "httpx>=0.27.0",
    # Claude API
    "anthropic>=0.28.0",
    # Scheduler
    "apscheduler>=3.10.4",
    # DI container
    "dependency-injector>=4.41.0",
    # Logging
    "structlog>=24.2.0",
    # Utilities
    "python-dotenv>=1.0.0",
    "tenacity>=8.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "anyio>=4.4.0",
]
backtest = [
    "vectorbt>=0.26.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
dev-dependencies = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "anyio>=4.4.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
